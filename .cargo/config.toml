[build]
target = "./i686-unknown-none.json"

[target.i686-unknown-none]
rustflags = [
    "-C", "default-linker-libraries=no",
    "-C", "link-arg=-Tlinker.ld", # リンカに `-Tlinker.ld` オプションを渡す = リンカにリンカスクリプト linker.ld を知らせる
]

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
